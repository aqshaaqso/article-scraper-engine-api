name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.middleware.lock -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  docker-build:
    needs: [test, go-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build middleware image
        run: docker build -f Dockerfile.middleware --tag article-scraper-middleware:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f Dockerfile.worker --tag article-scraper-worker:${{ github.sha }} .
      - name: Smoke test container
        run: |
          SCRAPER_API_KEY=ci-test-key docker compose up -d --wait --wait-timeout 180
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8010/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8010/health
          curl -fsS http://127.0.0.1:8010/swagger/index.html > /dev/null
          curl -fsS http://127.0.0.1:8010/openapi.json | python -c 'import json,sys; d=json.load(sys.stdin); assert "/v1/search/jobs" in d["paths"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/v1/jobs)" = 401
          curl -fsS -H 'X-API-Key: ci-test-key' http://127.0.0.1:8010/v1/jobs
          curl -fsS http://127.0.0.1:8010/ready
          SCRAPER_API_KEY=ci-test-key python scripts/hybrid_smoke.py --include-search-failure
      - name: Container logs
        if: always()
        run: docker compose logs || true
      - name: Stop stack
        if: always()
        run: docker compose down -v

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
