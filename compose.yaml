services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: article_scraper
      POSTGRES_USER: scraper_migrator
      POSTGRES_PASSWORD: scraper-migrator-dev
    volumes:
      - article-scraper-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper_migrator -d article_scraper"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    entrypoint: ["migrate"]
    environment:
      DATABASE_URL: postgres://scraper_migrator:scraper-migrator-dev@postgres:5432/article_scraper?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fastapi-middleware:
    build:
      context: .
      dockerfile: Dockerfile.middleware
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://scraper_api:scraper-api-dev@postgres:5432/article_scraper?sslmode=disable
      DATABASE_PATH: ""
      REQUIRE_API_KEY: "true"
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-dev-api-key}
    ports: ["${API_PORT:-8010}:8010"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  go-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://scraper_worker:scraper-worker-dev@postgres:5432/article_scraper?sslmode=disable
      DATABASE_PATH: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD", "workerhealth"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  article-scraper-postgres:
