services:
  article-scraper:
    container_name: article-scraper-engine
    build: .
    image: news-search-scraper-engine:0.3.0
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/article_scraper.db
      REQUIRE_API_KEY: "true"
    ports:
      - "8010:8010"
    volumes:
      - article-scraper-data:/app/data

volumes:
  article-scraper-data:
